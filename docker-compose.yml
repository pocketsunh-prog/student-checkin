name: student-checkin

services:
  mysql:
    image: mysql:8.0
    container_name: checkin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-checkin}
      MYSQL_USER: ${MYSQL_USER:-checkin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-checkinpass}
      TZ: Asia/Hong_Kong
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: checkin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-checkin}:${MYSQL_PASSWORD:-checkinpass}@mysql:3306/${MYSQL_DATABASE:-checkin}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      FACE_PROVIDER: ${FACE_PROVIDER:-human}
      FACE_MODEL_PATH: /app/models
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.60}
      FACE_MIN_CONFIDENCE: ${FACE_MIN_CONFIDENCE:-0.5}
      STORAGE_DIR: /app/storage
      SAVE_SCAN_IMAGES: ${SAVE_SCAN_IMAGES:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@school.edu}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-School Administrator}
      SEED_DEVICE_NAME: ${SEED_DEVICE_NAME:-Demo Kiosk}
      SEED_DEVICE_LOCATION: ${SEED_DEVICE_LOCATION:-Main Entrance}
      SEED_DEVICE_KEY: ${SEED_DEVICE_KEY:-demo-kiosk-key-12345}
      SEED_DEMO_STUDENTS: ${SEED_DEMO_STUDENTS:-true}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    container_name: checkin-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
